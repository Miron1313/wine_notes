<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>와인 테이스팅 노트</title>
  <meta name="description" content="WSET Level 2 SAT 기준 와인 테이스팅 기록장">
  <meta name="theme-color" content="#6d1a36">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="와인노트">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/icon-180.png">
  <link rel="stylesheet" href="css/app.css">

<body>
  <header class="topbar">
    <a href="#/" class="brand">🍷 <span data-i18n="app.name">와인노트</span> <small>WSET L2</small></a>
    <label class="lang-pick">🌐<select id="lang-select" aria-label="Language"></select></label>

  <main id="view" class="container"></main>

  <div id="new-menu" class="new-menu" hidden>
    <a href="#/new" class="btn primary" data-i18n="menu.new">📝 새 테이스팅</a>
    <a href="#/new?blind=1" class="btn" data-i18n="menu.blind">🕵️ 블라인드 테이스팅</a>
  </div>

  <nav class="tabbar">
    <a href="#/">📋<span data-i18n="nav.list">기록</span></a>
    <a href="#/stats">📊<span data-i18n="nav.stats">통계</span></a>
    <a href="#/new" id="fab" class="fab" aria-label="새 기록" data-i18n-aria="nav.new">＋</a>
    <a href="#/compare">⇆<span data-i18n="nav.compare">비교</span></a>
    <a href="#/settings">⚙️<span data-i18n="nav.settings">설정</span></a>
  </nav>

  <div id="toast" class="toast" role="status" hidden></div>

  <noscript>이 앱은 JavaScript가 필요합니다.</noscript>
  <script type="module" src="js/app.js"></script>

</html>
